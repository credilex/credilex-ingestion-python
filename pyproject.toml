[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "credilex-ingestion"
version = "0.1.0"
description = "Official Python SDK for Credilex Ingestion API — upload portafogli NPL/UTP con firma HMAC"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Credilex", email = "noreply@credilex.it" },
]
keywords = ["credilex", "ingestion", "npl", "utp", "api", "hmac", "credit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
pydantic = ["pydantic>=2.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://ingest.credilex.it/docs"
Documentation = "https://ingest.credilex.it/docs"
Repository = "https://github.com/credilex/credilex-ingestion-python"
Issues = "https://github.com/credilex/credilex-ingestion-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["credilex_ingestion"]

[tool.hatch.build.targets.sdist]
include = [
    "/credilex_ingestion",
    "/examples",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line-too-long gestito da formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q --strict-markers"

[tool.mypy]
python_version = "3.8"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
